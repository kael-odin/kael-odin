<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="10" viewBox="0 0 1280 10" role="img">
<style>
  text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  .pulse { animation: pulse 4.5s linear infinite; }
  .blink { animation: blink 1.15s steps(1,end) infinite; }
  .breathe { animation: breathe 5s ease-in-out infinite; }
  @keyframes pulse { from { transform: translateX(0); } to { transform: translateX(1540px); } }
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  @keyframes breathe { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
  
</style>
<defs><linearGradient id="pulseGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#00ffe5" stop-opacity="0"/><stop offset="50%" stop-color="#00ffe5" stop-opacity="1"/><stop offset="100%" stop-color="#00ffe5" stop-opacity="0"/></linearGradient></defs>
<line x1="0" y1="5" x2="1280" y2="5" stroke="#16223a" stroke-width="1"/><rect class="pulse" x="-260" y="3.5" width="260" height="3" rx="1.5" fill="url(#pulseGrad)"/></svg>

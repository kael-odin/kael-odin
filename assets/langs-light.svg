<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="328" viewBox="0 0 1200 328" role="img" aria-labelledby="langs-title langs-desc">
  <title id="langs-title">Repository languages</title>
  <desc id="langs-desc">Measured public repo language bytes — not skill levels. Up to 40 of the largest public repositories are sampled; unavailable responses are excluded. Segments follow the language list in reading order. JavaScript: 20,000,028 bytes (30.9%); TypeScript: 19,228,959 bytes (29.7%); Python: 13,127,793 bytes (20.3%); Go: 7,346,122 bytes (11.3%); HTML: 1,569,804 bytes (2.4%); CSS: 1,066,991 bytes (1.6%); Other: 2,480,885 bytes (3.8%). Denominator: all 64,820,582 sampled bytes. Percentages are rounded.</desc>

    text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; fill: #242423; }
    .title { font-family: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif; font-size: 26px; }
    .meta { font-size: 20px; fill: #666761; }
    .value { font-size: 68px; font-weight: 500; letter-spacing: -2px; }
    .secondary { font-size: 64px; }
    .label { font-size: 22px; fill: #666761; }
    .language { font-size: 22px; }
    .share { font-size: 32px; font-variant-numeric: tabular-nums; }
    .empty { font-size: 32px; }
  </style>

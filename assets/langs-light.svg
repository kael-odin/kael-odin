  <desc id="langs-desc">Measured public repo language bytes — not skill levels. Up to 40 of the largest public repositories are sampled; unavailable responses are excluded. Segments follow the language list in reading order. JavaScript: 20,092,740 bytes (30.9%); TypeScript: 19,228,959 bytes (29.6%); Python: 13,160,324 bytes (20.3%); Go: 7,346,122 bytes (11.3%); HTML: 1,569,829 bytes (2.4%); CSS: 1,066,991 bytes (1.6%); Other: 2,481,460 bytes (3.8%). Denominator: all 64,946,425 sampled bytes. Percentages are rounded.</desc>

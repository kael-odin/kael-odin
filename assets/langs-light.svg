  <title id="langs-title">Repository languages</title>
  <desc id="langs-desc">Measured public repo language bytes — not skill levels. Up to 40 of the largest public repositories are sampled; unavailable responses are excluded. Segments follow the language list in reading order. JavaScript: 18,592,944 bytes (33.2%); TypeScript: 14,037,119 bytes (25.0%); Python: 11,784,119 bytes (21.0%); Go: 7,346,122 bytes (13.1%); HTML: 1,440,463 bytes (2.6%); CSS: 976,597 bytes (1.7%); Other: 1,875,865 bytes (3.3%). Denominator: all 56,053,229 sampled bytes. Percentages are rounded.</desc>

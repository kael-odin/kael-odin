  <title id="langs-title">Repository languages</title>
  <desc id="langs-desc">Measured public repo language bytes — not skill levels. Up to 40 of the largest public repositories are sampled; unavailable responses are excluded. Segments follow the language list in reading order. TypeScript: 20,669,945 bytes (30.7%); JavaScript: 20,428,248 bytes (30.3%); Python: 13,826,741 bytes (20.5%); Go: 7,346,122 bytes (10.9%); HTML: 1,572,908 bytes (2.3%); CSS: 1,066,991 bytes (1.6%); Other: 2,491,108 bytes (3.7%). Denominator: all 67,402,063 sampled bytes. Percentages are rounded.</desc>

  <title id="langs-title">Repository languages</title>
  <desc id="langs-desc">Measured public repo language bytes — not skill levels. Up to 40 of the largest public repositories are sampled; unavailable responses are excluded. Segments follow the language list in reading order. TypeScript: 20,669,945 bytes (32.1%); JavaScript: 16,527,488 bytes (25.7%); Python: 14,971,776 bytes (23.3%); Go: 7,346,122 bytes (11.4%); HTML: 1,573,427 bytes (2.4%); CSS: 1,066,991 bytes (1.7%); Other: 2,173,798 bytes (3.4%). Denominator: all 64,329,547 sampled bytes. Percentages are rounded.</desc>

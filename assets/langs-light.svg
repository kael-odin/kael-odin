  <title id="langs-title">Repository languages</title>
  <desc id="langs-desc">Measured public repo language bytes — not skill levels. Up to 40 of the largest public repositories are sampled; unavailable responses are excluded. Segments follow the language list in reading order. JavaScript: 20,351,916 bytes (31.0%); TypeScript: 19,607,857 bytes (29.8%); Python: 13,294,329 bytes (20.2%); Go: 7,346,122 bytes (11.2%); HTML: 1,569,601 bytes (2.4%); CSS: 1,066,991 bytes (1.6%); Other: 2,485,304 bytes (3.8%). Denominator: all 65,722,120 sampled bytes. Percentages are rounded.</desc>

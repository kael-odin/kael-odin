  <title id="langs-title">Repository languages</title>
  <desc id="langs-desc">Measured public repo language bytes — not skill levels. Up to 40 of the largest public repositories are sampled; unavailable responses are excluded. Segments follow the language list in reading order. JavaScript: 19,881,298 bytes (30.9%); TypeScript: 19,228,959 bytes (29.9%); Python: 12,804,303 bytes (19.9%); Go: 7,346,122 bytes (11.4%); HTML: 1,569,827 bytes (2.4%); CSS: 1,066,991 bytes (1.7%); Other: 2,480,885 bytes (3.9%). Denominator: all 64,378,385 sampled bytes. Percentages are rounded.</desc>

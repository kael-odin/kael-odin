  <title id="langs-title">Repository languages</title>
  <desc id="langs-desc">Measured public repo language bytes — not skill levels. Up to 40 of the largest public repositories are sampled; unavailable responses are excluded. Segments follow the language list in reading order. JavaScript: 20,451,713 bytes (31.1%); TypeScript: 19,592,334 bytes (29.8%); Python: 13,160,324 bytes (20.0%); Go: 7,346,122 bytes (11.2%); HTML: 1,569,536 bytes (2.4%); CSS: 1,066,991 bytes (1.6%); Other: 2,483,420 bytes (3.8%). Denominator: all 65,670,440 sampled bytes. Percentages are rounded.</desc>

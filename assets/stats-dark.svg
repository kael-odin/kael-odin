<svg xmlns="http://www.w3.org/2000/svg" width="860" height="214" viewBox="0 0 860 214" role="img">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    /* .val intentionally sets no fill: a CSS fill would beat the per-tile
       fill="" presentation attribute in the cascade and flatten every accent. */
    .val { font-size: 32px; font-weight: 700; }
    .lbl { font-size: 10.5px; font-weight: 600; fill: #7a8ba3; letter-spacing: 2.2px; }
    .ttl { font-size: 12px; font-weight: 600; fill: #7a8ba3; letter-spacing: 3px; }
    .foot { font-size: 9.5px; fill: #3c4a63; letter-spacing: 1px; }
    .sweep { animation: sweep 9s linear infinite; }
    .blink { animation: blink 2.4s ease-in-out infinite; }
    @keyframes sweep {
      0%   { transform: translateX(-260px); }
      100% { transform: translateX(860px); }
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ffe5" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00ffe5" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#00ffe5" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect x="0" y="0" width="860" height="214" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="860" height="214" fill="url(#bg)"/>
  </g>
  <rect x="0.5" y="0.5" width="859" height="213" rx="13.5" fill="none" stroke="#16223a" stroke-width="1"/>
  <rect class="sweep" y="0" width="260" height="1.5" fill="url(#scan)"/>

  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

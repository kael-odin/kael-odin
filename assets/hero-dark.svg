<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="350" viewBox="0 0 1280 350" role="img">
<style>
  text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  .pulse { animation: pulse 4.5s linear infinite; }
  .blink { animation: blink 1.15s steps(1,end) infinite; }
  .breathe { animation: breathe 5s ease-in-out infinite; }
  @keyframes pulse { from { transform: translateX(0); } to { transform: translateX(1540px); } }
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  @keyframes breathe { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
  
</style>
<defs><linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#00ffe5"/><stop offset="48%" stop-color="#7b2ff7"/><stop offset="100%" stop-color="#ff2e97"/></linearGradient><linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ffffff" stop-opacity="0"/><stop offset="50%" stop-color="#ffffff" stop-opacity=".85"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/></linearGradient><linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#00ffe5" stop-opacity="0"/><stop offset="50%" stop-color="#00ffe5" stop-opacity=".13"/><stop offset="100%" stop-color="#00ffe5" stop-opacity="0"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#05070d"/><stop offset="100%" stop-color="#0a1020"/></linearGradient><linearGradient id="ruleGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#00ffe5"/><stop offset="100%" stop-color="#00ffe5" stop-opacity="0"/></linearGradient><clipPath id="nameClip"><text x="56" y="196" font-size="104" font-weight="800" letter-spacing="9">KAEL ODIN</text></clipPath><radialGradient id="halo"><stop offset="0%" stop-color="#7b2ff7" stop-opacity=".38"/><stop offset="100%" stop-color="#7b2ff7" stop-opacity="0"/></radialGradient><filter id="glow" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="5.0" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>

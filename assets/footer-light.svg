<title id="title">Good tools should be shared. Kael Odin — keep building.</title>
<desc id="desc">Good tools should be shared. Kael Odin — keep building.. Original artwork for Kael Odin.</desc>
<defs><clipPath id="canvas"><rect width="1200" height="230" rx="22"/></clipPath></defs>

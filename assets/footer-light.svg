<g clip-path="url(#canvas)"><rect width="1200" height="230" fill="#f5f2ec"/><path d="M42 38H1158" stroke="#d2cec4" opacity="1"/><text x="42" y="105" font-family="Arial, 'Segoe UI', 'Noto Sans', sans-serif" font-size="56" font-weight="800" fill="#242423" letter-spacing="-2">GOOD TOOLS.</text><text x="42" y="171" font-family="Arial, 'Segoe UI', 'Noto Sans', sans-serif" font-size="56" font-weight="800" fill="#986232" letter-spacing="-2">SHOULD BE SHARED.</text><text x="1158" y="102" font-family="Consolas, 'Liberation Mono', monospace" font-size="22" font-weight="700" fill="#242423" text-anchor="end">KAEL ODIN</text><text x="1158" y="141" font-family="Consolas, 'Liberation Mono', monospace" font-size="17" font-weight="400" fill="#666761" text-anchor="end">KEEP BUILDING ↗</text><text x="42" y="205" font-family="'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="24" font-weight="400" fill="#666761" >把工具做好，把过程开源。</text></g></svg>

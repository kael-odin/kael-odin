  <title id="langs-title">Repository languages</title>
  <desc id="langs-desc">Measured public repo language bytes — not skill levels. Up to 40 of the largest public repositories are sampled; unavailable responses are excluded. Segments follow the language list in reading order. JavaScript: 20,861,809 bytes (30.2%); TypeScript: 20,669,945 bytes (30.0%); Python: 14,971,776 bytes (21.7%); Go: 7,346,122 bytes (10.6%); HTML: 1,573,100 bytes (2.3%); CSS: 1,066,991 bytes (1.5%); Other: 2,505,397 bytes (3.6%). Denominator: all 68,995,140 sampled bytes. Percentages are rounded.</desc>

  <title id="langs-title">Repository languages</title>
  <desc id="langs-desc">Measured public repo language bytes — not skill levels. Up to 40 of the largest public repositories are sampled; unavailable responses are excluded. Segments follow the language list in reading order. JavaScript: 20,426,718 bytes (30.8%); TypeScript: 19,613,427 bytes (29.6%); Python: 13,714,855 bytes (20.7%); Go: 7,346,122 bytes (11.1%); HTML: 1,572,543 bytes (2.4%); CSS: 1,066,991 bytes (1.6%); Other: 2,488,485 bytes (3.8%). Denominator: all 66,229,141 sampled bytes. Percentages are rounded.</desc>

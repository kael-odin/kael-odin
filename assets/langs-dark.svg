  <title id="langs-title">Repository languages</title>
  <desc id="langs-desc">Measured public repo language bytes — not skill levels. Up to 40 of the largest public repositories are sampled; unavailable responses are excluded. Segments follow the language list in reading order. JavaScript: 19,481,027 bytes (32.6%); TypeScript: 15,050,442 bytes (25.2%); Python: 12,713,978 bytes (21.3%); Go: 7,346,122 bytes (12.3%); HTML: 1,569,308 bytes (2.6%); CSS: 1,042,495 bytes (1.7%); Other: 2,476,100 bytes (4.1%). Denominator: all 59,679,472 sampled bytes. Percentages are rounded.</desc>

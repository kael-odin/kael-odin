  <desc id="langs-desc">Measured public repo language bytes — not skill levels. Up to 40 of the largest public repositories are sampled; unavailable responses are excluded. Segments follow the language list in reading order. JavaScript: 19,659,347 bytes (30.6%); TypeScript: 19,228,959 bytes (30.0%); Python: 12,804,303 bytes (20.0%); Go: 7,346,122 bytes (11.5%); HTML: 1,569,981 bytes (2.4%); CSS: 1,066,991 bytes (1.7%); Other: 2,480,885 bytes (3.9%). Denominator: all 64,156,588 sampled bytes. Percentages are rounded.</desc>

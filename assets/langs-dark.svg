  <title id="langs-title">Repository languages</title>
  <desc id="langs-desc">Measured public repo language bytes — not skill levels. Up to 40 of the largest public repositories are sampled; unavailable responses are excluded. Segments follow the language list in reading order. JavaScript: 19,309,126 bytes (32.9%); TypeScript: 15,050,442 bytes (25.6%); Python: 11,916,815 bytes (20.3%); Go: 7,346,122 bytes (12.5%); HTML: 1,560,416 bytes (2.7%); CSS: 1,037,070 bytes (1.8%); Other: 2,475,553 bytes (4.2%). Denominator: all 58,695,544 sampled bytes. Percentages are rounded.</desc>

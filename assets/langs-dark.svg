  <title id="langs-title">Repository languages</title>
  <desc id="langs-desc">Measured public repo language bytes — not skill levels. Up to 40 of the largest public repositories are sampled; unavailable responses are excluded. Segments follow the language list in reading order. JavaScript: 18,540,835 bytes (33.3%); TypeScript: 14,037,119 bytes (25.2%); Python: 11,450,645 bytes (20.6%); Go: 7,346,122 bytes (13.2%); HTML: 1,413,972 bytes (2.5%); CSS: 976,597 bytes (1.8%); Other: 1,872,300 bytes (3.4%). Denominator: all 55,637,590 sampled bytes. Percentages are rounded.</desc>

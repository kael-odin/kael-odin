  <title id="langs-title">Repository languages</title>
  <desc id="langs-desc">Measured public repo language bytes — not skill levels. Up to 40 of the largest public repositories are sampled; unavailable responses are excluded. Segments follow the language list in reading order. JavaScript: 18,521,992 bytes (33.3%); TypeScript: 14,037,119 bytes (25.2%); Python: 11,437,969 bytes (20.6%); Go: 7,346,122 bytes (13.2%); HTML: 1,415,140 bytes (2.5%); CSS: 976,597 bytes (1.8%); Other: 1,871,768 bytes (3.4%). Denominator: all 55,606,707 sampled bytes. Percentages are rounded.</desc>

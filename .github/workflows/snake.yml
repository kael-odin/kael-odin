name: "! Contribution snake"

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate the snake, copper palette
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # color_dots runs level 0 -> 4. Level 0 is deliberately lifted off the
          # card background, otherwise the empty cells vanish and the grid
          # reads as a blank box.
          outputs: |
            dist/snake-dark.svg?color_snake=#D3923C&color_dots=#211F1B,#3d2d1c,#6e461e,#a86b2e,#D3923C
            dist/snake-light.svg?color_snake=#985C15&color_dots=#e8e5dd,#dccbb4,#c7a77a,#ad7a3f,#985C15

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
